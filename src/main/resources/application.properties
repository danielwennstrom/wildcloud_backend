# Application profile (production, development)
spring.profiles.active=development
spring.application.name=wildcloud_backend
# TODO: fundera på rimliga värden för file sizes, counts, etc
spring.webflux.multipart.max-in-memory-size=50MB
spring.webflux.multipart.max-disk-usage-per-part=50MB
spring.webflux.multipart.max-parts=5000
# Flyway and R2DBC configuration
spring.flyway.url=${POSTGRES_URL}
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.r2dbc.url=${POSTGRES_R2DBC_URL}
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}
spring.data.r2dbc.repositories.enabled=true
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=30
spring.r2dbc.pool.max-idle-time=10m
spring.r2dbc.pool.max-acquire-time=5s
spring.r2dbc.pool.max-create-connection-time=10s
spring.r2dbc.pool.validation-query=SELECT 1
spring.r2dbc.pool.validation-depth=remote
spring.r2dbc.properties.connectTimeout=PT10S
spring.r2dbc.properties.statementTimeout=PT30S

# Wildcloud backend specific configuration
wildcloud.upload.min-file-size=1KB
wildcloud.upload.max-file-size=5MB
wildcloud.upload.upload-concurrency-limit=5
wildcloud.upload.retrieval-concurrency-limit=10
# Cloudflare R2 configuration
wildcloud.cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
wildcloud.cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
wildcloud.cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
wildcloud.cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME}
wildcloud.cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
# se TODO i R2Properties (worker)
wildcloud.cloudflare.r2.use-custom-domain=false
wildcloud.cloudflare.r2.custom-domain=${CLOUDFLARE_R2_CUSTOM_DOMAIN}
# Logging
logging.level.org.wildcloud.wildcloud_backend=INFO
logging.level.org.springframework=WARN