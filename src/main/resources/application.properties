# Application profile (prod, dev)
spring.profiles.active=dev

spring.application.name=wildcloud_backend
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
# Wildcloud backend specific configuration
wildcloud.upload.min-file-size=1KB
wildcloud.upload.max-file-size=20MB
#Cloudflare R2 configuration
wildcloud.cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
wildcloud.cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
wildcloud.cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
wildcloud.cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME}
wildcloud.cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
